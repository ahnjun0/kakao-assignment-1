<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla Todo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <h1 class="app__title">Todo</h1>

      <!-- 일간 뷰: 이전/다음 버튼 + 현재 선택된 날짜 -->
      <section class="date-bar" aria-label="날짜 선택">
        <button
          type="button"
          id="prev-day-button"
          class="date-bar__nav"
          aria-label="이전 날짜"
        >
          ‹
        </button>
        <div id="selected-date-label" class="date-bar__label">YYYY-MM-DD</div>
        <button
          type="button"
          id="next-day-button"
          class="date-bar__nav"
          aria-label="다음 날짜"
        >
          ›
        </button>
      </section>

      <!-- 주간 뷰: 월~일 7일 + 주차 이동 -->
      <section class="week-view" aria-label="주간 뷰">
        <button
          type="button"
          id="prev-week-button"
          class="week-view__nav"
          aria-label="이전 주"
        >
          «
        </button>
        <ul id="week-list" class="week-view__list">
          <!-- JS 에서 7개 셀을 동적으로 렌더링 -->
        </ul>
        <button
          type="button"
          id="next-week-button"
          class="week-view__nav"
          aria-label="다음 주"
        >
          »
        </button>
      </section>

      <!-- 입력 영역 -->
      <form id="todo-form" class="todo-input">
        <input
          type="text"
          id="todo-input-field"
          class="todo-input__field"
          placeholder="할 일을 입력하세요"
          autocomplete="off"
        />
        <button type="submit" class="todo-input__button">추가</button>
      </form>

      <!-- 빈 입력 등 상황에 따른 안내 메시지 -->
      <p id="input-message" class="todo-input__message" aria-live="polite"></p>

      <!-- 상태 필터 탭 -->
      <nav class="filter-bar" aria-label="상태 필터">
        <button
          type="button"
          class="filter-bar__button is-active"
          data-filter="all"
        >
          전체
        </button>
        <button type="button" class="filter-bar__button" data-filter="active">
          진행 중
        </button>
        <button
          type="button"
          class="filter-bar__button"
          data-filter="completed"
        >
          완료
        </button>
      </nav>

      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty-message" class="todo-list__empty">등록된 할 일이 없습니다.</p>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
