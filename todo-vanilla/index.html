<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla Todo</title>
    <link rel="stylesheet" href="./style.css" />
    <!--
      테마 초기화: body 가 그려지기 전에 data-theme 을 미리 세팅해
      새로고침 시 라이트→다크로 깜빡이는 현상(FOUC)을 막는다.
      우선순위: localStorage 저장값 → 시스템 설정 → 라이트
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("vanilla-todo:theme");
          if (stored === "dark" || stored === "light") {
            document.documentElement.setAttribute("data-theme", stored);
            return;
          }
        } catch (e) {}
        if (
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
        ) {
          document.documentElement.setAttribute("data-theme", "dark");
        } else {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1 class="app__title">Todo</h1>
        <button
          type="button"
          id="theme-toggle-button"
          class="theme-toggle"
          aria-label="테마 전환"
        >
          <!-- 라이트 모드일 때 보이는 달 아이콘 (클릭 시 다크로 전환) -->
          <svg
            class="theme-toggle__icon theme-toggle__icon--moon"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <!-- 다크 모드일 때 보이는 해 아이콘 (클릭 시 라이트로 전환) -->
          <svg
            class="theme-toggle__icon theme-toggle__icon--sun"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <line x1="12" y1="2" x2="12" y2="5" />
            <line x1="12" y1="19" x2="12" y2="22" />
            <line x1="2" y1="12" x2="5" y2="12" />
            <line x1="19" y1="12" x2="22" y2="12" />
            <line x1="4.93" y1="4.93" x2="7.05" y2="7.05" />
            <line x1="16.95" y1="16.95" x2="19.07" y2="19.07" />
            <line x1="4.93" y1="19.07" x2="7.05" y2="16.95" />
            <line x1="16.95" y1="7.05" x2="19.07" y2="4.93" />
          </svg>
        </button>
      </header>

      <!-- 일간 뷰 -->
      <section class="date-bar" aria-label="날짜 선택">
        <button type="button" id="prev-day-button" class="date-bar__nav" aria-label="이전 날짜">‹</button>
        <div class="date-bar__center">
          <button
            type="button"
            id="date-toggle-button"
            class="date-bar__toggle"
            aria-haspopup="dialog"
            aria-expanded="false"
          >
            <span id="selected-date-label" class="date-bar__label">YYYY-MM-DD</span>
            <span class="date-bar__caret" aria-hidden="true">▾</span>
          </button>
          <button type="button" id="go-today-button" class="date-bar__today" hidden>오늘로</button>
        </div>
        <button type="button" id="next-day-button" class="date-bar__nav" aria-label="다음 날짜">›</button>

        <!-- 달력 팝오버 -->
        <div id="calendar-popover" class="calendar" role="dialog" aria-label="달력" hidden>
          <header class="calendar__header">
            <button type="button" id="prev-month-button" class="calendar__nav" aria-label="이전 달">‹</button>
            <span id="calendar-month-label" class="calendar__month-label">YYYY년 M월</span>
            <button type="button" id="next-month-button" class="calendar__nav" aria-label="다음 달">›</button>
          </header>
          <ul class="calendar__weekdays" aria-hidden="true">
            <li>월</li><li>화</li><li>수</li><li>목</li><li>금</li><li>토</li><li>일</li>
          </ul>
          <ul id="calendar-days" class="calendar__days"></ul>
        </div>
      </section>

      <!-- 주간 뷰 -->
      <section class="week-view" aria-label="주간 뷰">
        <button type="button" id="prev-week-button" class="week-view__nav" aria-label="이전 주">«</button>
        <ul id="week-list" class="week-view__list"></ul>
        <button type="button" id="next-week-button" class="week-view__nav" aria-label="다음 주">»</button>
      </section>

      <!-- 입력 영역 -->
      <form id="todo-form" class="todo-input">
        <input
          type="text"
          id="todo-input-field"
          class="todo-input__field"
          placeholder="할 일을 입력하세요"
          autocomplete="off"
        />
        <button type="submit" class="todo-input__button">추가</button>
      </form>

      <p id="input-message" class="todo-input__message" aria-live="polite"></p>

      <!-- 상태 필터 탭 -->
      <nav class="filter-bar" aria-label="상태 필터">
        <button type="button" class="filter-bar__button is-active" data-filter="all">전체</button>
        <button type="button" class="filter-bar__button" data-filter="active">진행 중</button>
        <button type="button" class="filter-bar__button" data-filter="completed">완료</button>
      </nav>

      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty-message" class="todo-list__empty">등록된 할 일이 없습니다.</p>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
